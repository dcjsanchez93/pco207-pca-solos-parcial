name: Executar PCA

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "dados/**"
      - ".github/workflows/pca.yml"

jobs:
  pca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: |
          Rscript -e 'install.packages(c("FactoMineR", "factoextra", "ggplot2"), repos = "https://cloud.r-project.org")'

      - name: Executar analise
        run: Rscript scripts/analise_pca.R

      - name: Disponibilizar graficos
        uses: actions/upload-artifact@v4
        with:
          name: graficos-pca
          path: resultados/*.png
          if-no-files-found: error
          retention-days: 30
