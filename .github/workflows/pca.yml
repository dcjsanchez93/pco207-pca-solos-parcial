name: Executar PCA

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "dados/**"
      - ".github/workflows/pca.yml"

jobs:
  pca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libuv1-dev libpng-dev libfreetype6-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Instalar pacotes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::FactoMineR
            any::factoextra
            any::ggplot2
          cache-version: 1

      - name: Executar analise
        run: Rscript scripts/analise_pca.R

      - name: Disponibilizar graficos
        uses: actions/upload-artifact@v4
        with:
          name: graficos-pca
          path: resultados/*.png
          if-no-files-found: error
          retention-days: 30
